<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Gmail Support Assistant system architecture</title>
  <desc id="desc">A Google Form inquiry flows through Sheets and a stateful Make workflow to OpenAI, CRM, Slack, and a Gmail draft, with terminal replay protection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 38px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .subtitle{font:400 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}
      .label{font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .body{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}
      .mini{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e2e8f0}
      .arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .box{stroke-width:1.5;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" class="title">Gmail Support Assistant</text>
  <text x="72" y="104" class="subtitle">Stateful customer-support automation · human-reviewed Gmail drafts only</text>

  <path class="arrow" d="M258 249 H338"/>
  <path class="arrow" d="M566 249 H646"/>
  <path class="arrow" d="M920 249 H1000"/>
  <path class="arrow" d="M1118 330 V390"/>
  <path class="arrow" d="M1000 500 H920"/>
  <path class="arrow" d="M646 500 H566"/>
  <path class="arrow" d="M338 500 H258"/>

  <g class="box">
    <rect x="72" y="170" width="186" height="158" rx="20" fill="#2563eb" stroke="#60a5fa"/>
    <circle cx="112" cy="212" r="20" fill="#dbeafe"/>
    <path d="M103 203h18v18h-18z M106 207h12 M106 212h12 M106 217h8" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="101" y="265" class="label">Google Form</text>
    <text x="101" y="292" class="body">Customer inquiry</text>
  </g>

  <g class="box">
    <rect x="338" y="170" width="228" height="158" rx="20" fill="#047857" stroke="#34d399"/>
    <text x="370" y="216" class="mini">GOOGLE SHEETS</text>
    <text x="370" y="256" class="label">Form</text>
    <text x="370" y="285" class="body">Five-column source contract</text>
  </g>

  <g class="box">
    <rect x="646" y="150" width="274" height="198" rx="22" fill="#6d28d9" stroke="#a78bfa"/>
    <text x="680" y="196" class="mini">MAKE.COM · PHASE 2B</text>
    <text x="680" y="238" class="label">Request ID + state gate</text>
    <text x="680" y="270" class="body">New / retry work proceeds</text>
    <rect x="680" y="292" width="206" height="34" rx="17" fill="#4c1d95"/>
    <text x="698" y="314" class="mini">COMPLETED replay → STOP</text>
  </g>

  <g class="box">
    <rect x="1000" y="170" width="368" height="160" rx="22" fill="#0f766e" stroke="#5eead4"/>
    <text x="1034" y="215" class="mini">OPENAI · STRUCTURED OUTPUT</text>
    <text x="1034" y="255" class="label">Triage + reply draft</text>
    <text x="1034" y="284" class="body">Category · priority · sentiment · summary</text>
    <text x="1034" y="306" class="body">Email column excluded · store disabled</text>
  </g>

  <g class="box">
    <rect x="1000" y="390" width="368" height="218" rx="22" fill="#1e293b" stroke="#64748b"/>
    <text x="1034" y="435" class="mini">GOOGLE SHEETS</text>
    <text x="1034" y="476" class="label">Processing_State</text>
    <text x="1034" y="508" class="body">Persist AI output before side effects</text>
    <text x="1034" y="536" class="body">CRM_Written · Slack_Notified</text>
    <text x="1034" y="564" class="body">Gmail_Draft_Created · COMPLETED</text>
  </g>

  <g class="box">
    <rect x="704" y="420" width="216" height="160" rx="20" fill="#166534" stroke="#4ade80"/>
    <text x="736" y="465" class="mini">GOOGLE SHEETS</text>
    <text x="736" y="506" class="label">CRM record</text>
    <text x="736" y="536" class="body">One enriched row</text>
  </g>

  <g class="box">
    <rect x="382" y="420" width="184" height="160" rx="20" fill="#7c3aed" stroke="#c4b5fd"/>
    <text x="414" y="465" class="mini">SLACK</text>
    <text x="414" y="506" class="label">Notify team</text>
    <text x="414" y="536" class="body">Internal visibility</text>
  </g>

  <g class="box">
    <rect x="72" y="420" width="186" height="160" rx="20" fill="#b91c1c" stroke="#fca5a5"/>
    <text x="104" y="465" class="mini">GMAIL</text>
    <text x="104" y="506" class="label">Create draft</text>
    <text x="104" y="536" class="body">Human reviews + sends</text>
  </g>

  <rect x="72" y="636" width="1296" height="42" rx="21" fill="#0b1220" stroke="#334155"/>
  <text x="102" y="663" class="mini">Safety invariant: the automation creates Gmail drafts; it never sends email automatically.</text>
</svg>
